name: Chat quality regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Flask==3.0.3 flask-cors==4.0.1 fastapi==0.115.12 pytest==8.3.5
      - run: python -m pytest tests/test_chat_conversation.py tests/test_chat_concurrency.py tests/test_rag_prompt.py tests/test_lexical_retrieval.py tests/test_conversational_rag.py tests/test_corpus.py tests/test_published_corpus.py -q
